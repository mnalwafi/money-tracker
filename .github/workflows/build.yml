name: Build Android App & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Push Build Result to Dedicated Build Repository
        if: env.BUILD_REPO != '' && env.BUILD_REPO_TOKEN != ''
        env:
          BUILD_REPO: ${{ secrets.BUILD_REPO }}
          BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/*.apk build-output/
          cd build-output
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "# Build Results" > README.md
          echo "Automated build output for Money Tracker (Buckwheat)." >> README.md
          echo "- Build Date: $(date -u)" >> README.md
          echo "- Source Commit: ${{ github.sha }}" >> README.md
          echo "" >> README.md
          echo "### Download APK" >> README.md
          for f in *.apk; do
            echo "- [$f](./$f)" >> README.md
          done
          git add .
          git commit -m "Automated build result from commit ${{ github.sha }}"
          git remote add origin https://x-access-token:${BUILD_REPO_TOKEN}@github.com/${BUILD_REPO}.git
          git push -f origin main
